[providers.gitlab]
base_url = "https://gitlab.example.com"

[llm]
provider = "gemini_cli"
model = "gemini-2.5-pro"
timeout_seconds = 180
max_context_tokens = 12000
temperature = 0.1
gemini_bin = "gemini"
gemini_timeout_seconds = 240
gemini_output_format = "json"

[privacy]
local_only = false
redact_secrets = true

[review]
severity_threshold = "medium"
max_inline_comments = 8
max_diff_bytes = 200000
max_files = 50

[risk_gate]
enabled = true
publish = true
block_threshold = 75
needs_human_threshold = 50

protected_paths = [
  "src/features/sync/**",
  "src/auth/**",
  "src/security/**",
  "migrations/**"
]

[risk_gate.owner_reviews]
"src/features/sync/**" = "Mobile Lead"
"src/auth/**" = "Security Lead"
"migrations/**" = "Backend Lead"

[risk_gate.required_tests]
"src/features/sync/**" = ["recovery", "offline", "retry"]
"src/auth/**" = ["auth", "session"]
"migrations/**" = ["rollback"]

[risk_gate.contract_paths]
patterns = [
  "openapi/**",
  "**/*.proto",
  "docs/api/**",
  "src/api/contracts/**"
]

[risk_gate.migration_paths]
patterns = [
  "migrations/**",
  "db/migrations/**",
  "**/schema.sql"
]

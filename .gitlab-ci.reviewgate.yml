stages:
  - review

reviewgate:
  stage: review
  image: rust:1.82
  before_script:
    - cargo build --release
  script:
    - ./target/release/reviewgate review --ci --publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


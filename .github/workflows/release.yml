name: Release Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="reviewgate-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/reviewgate" dist/reviewgate
          tar -C dist -czf "$archive" reviewgate
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: reviewgate-${{ matrix.target }}
          path: |
            reviewgate-${{ matrix.target }}.tar.gz
            reviewgate-${{ matrix.target }}.tar.gz.sha256
